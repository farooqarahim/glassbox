name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install --locked cargo-audit
      # Use cargo-audit directly rather than rustsec/audit-check@v2: that
      # action fails on the `paste` *unmaintained* warning regardless of its
      # `ignore` input. cargo-audit's --ignore correctly suppresses it.
      # paste has no known vulnerability; see deny.toml for the rationale.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2024-0436

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: generate SBOM
        # `--all` emits one <crate>.cdx.json per workspace member; the
        # `--output-pattern` flag was removed in newer cargo-cyclonedx.
        run: cargo cyclonedx --format json --all
      - name: upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            crates/**/glassbox-*.cdx.json
            target/**/glassbox-*.cdx.json
          if-no-files-found: warn

  corpus:
    name: canonical-form corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: regenerate corpus
        run: cargo run --example gen_corpus -p glassbox-core
      - name: verify corpus has not drifted
        run: |
          if ! git diff --quiet crates/glassbox-core/tests/corpus/canonical_corpus.jsonl; then
            echo "::error::canonical corpus drifted; rerun \`cargo run --example gen_corpus -p glassbox-core\` and commit the result"
            git --no-pager diff --stat crates/glassbox-core/tests/corpus/canonical_corpus.jsonl
            exit 1
          fi

  docs:
    name: rustdoc (warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  python-sdk:
    name: python sdk (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # The SDK tests drive the real server binaries and skip if they are
      # missing, so build them first.
      - name: build workspace binaries
        run: cargo build --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        working-directory: sdks/python
        run: pip install -e ".[test]" ruff mypy
      - name: ruff
        working-directory: sdks/python
        run: ruff check .
      - name: mypy
        working-directory: sdks/python
        run: mypy --strict glassbox
      - name: pytest
        working-directory: sdks/python
        run: pytest -q -rs

  typescript-sdk:
    name: typescript sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - name: typecheck + build
        run: npm run build
      - name: test
        run: npm test

  go-sdk:
    name: go sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # SDK tests drive the real server binaries; build them first.
      - name: build workspace binaries
        working-directory: .
        run: cargo build --workspace
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
