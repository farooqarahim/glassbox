[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.92
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # webpki-roots 1.0 ships Mozilla's CA-root data under CDLA-Permissive-2.0
    # (a permissive data license). Pulled transitively via reqwest/rustls.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
