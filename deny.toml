[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (proc-macro, no known vulnerability). It is a
    # deep transitive dependency of the RustCrypto / ml-dsa stack with no
    # drop-in replacement yet. Tracked; revisit when upstreams migrate off it.
    # Newer cargo-deny (used in CI) flags it even though older local versions
    # do not, so keep this entry.
    "RUSTSEC-2024-0436",
]

[licenses]
confidence-threshold = 0.92
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # webpki-roots 1.0 ships Mozilla's CA-root data under CDLA-Permissive-2.0
    # (a permissive data license). Pulled transitively via reqwest/rustls.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
