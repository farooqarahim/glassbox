[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox"
version = "0.7.0"
description = "Tamper-evident audit ledger client for AI systems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "The Glassbox Authors" }]
keywords = ["audit", "ledger", "ai", "compliance", "annex-iv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
test = ["pytest>=8.0", "pytest-asyncio>=1.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["glassbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
